    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'], // Set Inter as default font
            },
            colors: {
              primary: '#6366f1', // Indigo 500
              secondary: '#8b5cf6', // Violet 500

          }
        }
      }

    <style>
      /* Custom scrollbar for better mobile feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      body {
        -webkit-tap-highlight-color: transparent;

  <body class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-white font-sans antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
